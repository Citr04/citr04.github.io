      <li>

        <div class="entry">
          <h2><a href="/journal/2026-09-20-shengsi-qulai.html">生死去来，飞鸿印雪</a></h2>
          <time datetime="2026-09-20">2026-09-20</time>
          <p>从很久以前，我一直想开辟一块属于自己的空间，它不是微信朋友圈，不是小红书，不是任何论坛，我可以自己把它摆弄成喜欢的样子，塞进去我喜欢的元素，把脑子里纠缠不清的材料堆砌成自己的城池。<br>无论是「Syven/思闻」还是「ORIN/澄心」的词都与我的名字有些关联，也有些我用了数年甚至十数年的冲浪痕迹...</p>
          <a class="read-more" href="/journal/2026-09-20-shengsi-qulai.html" aria-label="阅读全文：生死去来，飞鸿印雪">阅读全文 <span aria-hidden="true">→</span></a>
        </div>
      </li>
    </ul>

  </article>
